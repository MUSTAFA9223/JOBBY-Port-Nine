name: Build and deploy JOBBY Maps (mobile)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'maps-viewer.js'
      - 'original/**'
      - 'jobby-characters/**'
      - '.github/workflows/original-port-nine.yml'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-compatible bundler
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12 playwright-core@1.56.1
      - name: Build self-hosted mobile entrypoint
        run: |
          set -e
          test -f original/vendor/three/build/three.module.js
          test -f original/src/arenas/a08_palisade.js
          test -f jobby-characters/Casual_Male.glb
          cp original/src/engine/assets.js /tmp/jobby-original-assets.js
          cp original/src/engine/textures.js /tmp/jobby-original-textures.js
          sed -i 's/const size = opts.size ?? 256;/const size = Math.min(opts.size ?? 256, 128);/' original/src/engine/textures.js
          sed -i "s@../../assets/@../original/assets/@g" original/src/engine/assets.js
          ./node_modules/.bin/esbuild maps-viewer.js \
            --bundle \
            --splitting \
            --format=esm \
            --target=es2020 \
            --minify \
            --outdir=dist \
            --alias:three=./original/vendor/three/build/three.module.js \
            --alias:three/addons=./original/vendor/three/examples/jsm
          cp /tmp/jobby-original-assets.js original/src/engine/assets.js
          cp /tmp/jobby-original-textures.js original/src/engine/textures.js
          node --check dist/maps-viewer.js
          test -s dist/maps-viewer.js
          mkdir -p site
          cp index.html site/
          cp -a dist original jobby-characters site/
      - name: Browser smoke test (mobile WebGL + character)
        run: node tests/mobile-smoke.cjs
      - name: Save real in-game test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobby-map-mobile-preview
          path: /tmp/jobby-maps-mobile-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
