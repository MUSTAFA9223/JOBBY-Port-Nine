name: Import original PORT NINE and deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/original-port-nine.yml'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'maps-viewer.js'
      - 'characters.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download full original open-source game
        run: |
          git clone --depth 1 https://github.com/twalkerallenii-spec/hide-and-seek-arena.git /tmp/port-nine-original
          mkdir -p original
          cp -a /tmp/port-nine-original/. original/
          rm -rf original/.git original/node_modules
          cp original/LICENSE original/LICENSE-original.txt
      - name: Import JOBBY character models
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MUSTAFA9223/jobby-site.git /tmp/jobby-source
          cd /tmp/jobby-source
          git sparse-checkout set public/world/models
          cd -
          mkdir -p jobby-characters
          cp /tmp/jobby-source/public/world/models/*.glb jobby-characters/
      - name: Commit complete original game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original jobby-characters
          if ! git diff --cached --quiet; then git commit -m "Import full original MIT licensed game for faithful Port Nine test"; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
